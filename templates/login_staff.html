<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetPulse Support Desk · Staff sign in</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:"Segoe UI",system-ui,sans-serif;background:#E9EEF3;color:#1f2d3a}
header{background:#1f3a52;color:#fff;padding:1rem 2rem;font-weight:600;border-bottom:4px solid #F2A541}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem}
.card{background:#fff;width:100%;max-width:400px;border:1px solid #cbd5df;border-top:4px solid #F2A541;border-radius:4px;padding:2rem}
h2{margin:0 0 .25rem}.sub{color:#5c6b7a;margin:0 0 1rem;font-size:.95rem}
label{display:block;font-weight:600;margin:1rem 0 .3rem;font-size:.9rem}input{width:100%;padding:.65rem .75rem;border:1px solid #9fb0c0;border-radius:3px;font-size:1rem}
input:focus{outline:3px solid #F2A54166;border-color:#c98216}
button{width:100%;margin-top:1.4rem;padding:.7rem;border:0;border-radius:3px;background:#1f3a52;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
button:hover{background:#2c5273}.msg{padding:.65rem .9rem;border-radius:3px;margin:.75rem 0}.danger{background:#fde8e8;color:#9b1c1c}.warning{background:#fff4d6;color:#7a5a00}.success{background:#dcf5e9;color:#145a3a}
.demo{margin-top:1.25rem;font-size:.85rem;color:#5c6b7a}a{color:#1f3a52}
</style></head><body>
<header>NetPulse Support Desk</header>
<main><form class="card" method="post">
<h2>Staff sign in</h2><p class="sub">For support staff only. Customers sign in on the customer page.</p>
{% with m = get_flashed_messages(with_categories=true) %}{% for c,t in m %}<div class="msg {{c}}">{{t}}</div>{% endfor %}{% endwith %}
<label for="u">Staff username</label><input id="u" name="username" required autofocus autocomplete="username">
<label for="p">Password</label><input id="p" name="password" type="password" required autocomplete="current-password">
<button>Sign in to support desk</button>
<p class="demo">Demo: <code>{{hint[0]}}</code> / <code>{{hint[1]}}</code></p><p class="demo"><a href="/">Back to all panels</a></p>
</form></main></body></html>
